name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ato
          POSTGRES_PASSWORD: ato
          POSTGRES_DB: ato_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ato -d ato_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://ato:ato@localhost:5432/ato_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted_files="$(gofmt -l cmd internal migrations)"
          if [ -n "$unformatted_files" ]; then
            printf '%s\n' "$unformatted_files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with PostgreSQL and race detection
        run: go test -race -count=1 ./...
      - name: Build deployment image
        run: docker build -t accountguard:test .

  dashboard:
    name: Dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint dashboard
        run: npm run lint
      - name: Check dashboard formatting
        run: npm run format:check
      - name: Test sessions and review validation
        run: npm test
      - name: Build dashboard
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test analyst browser flows
        run: npm run test:e2e
