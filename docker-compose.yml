services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ato
      POSTGRES_PASSWORD: ato
      POSTGRES_DB: ato
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ato -d ato"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
